<html lang="zh-CN">

<style>
*{box-sizing:border-box} body{margin:0;background:#07111f;color:#f2f6fc;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer} button:focus-visible{outline:3px solid #9ac6ff;outline-offset:2px}
.screen{width:1920px;height:1080px;position:relative;overflow:hidden;background:linear-gradient(160deg,#0a172a 5%,#10233d 53%,#101629 100%)}

.desktop{position:absolute;inset:80px 32px 118px;display:grid;grid-template-columns:2fr 1fr;gap:24px;opacity:.35}.panel-placeholder{background:#14253c;border:1px solid #31475e}.right{display:grid;gap:24px;grid-template-rows:1fr 1fr}
.scrim{position:absolute;inset:68px 0 96px;background:#030a14b3}
.sheet{position:absolute;top:96px;left:240px;width:1440px;height:830px;background:#15283e;border:1px solid #526b85;box-shadow:0 18px 70px #0005;padding:30px 40px 32px}.sheet:after,.frame:after{content:"";pointer-events:none;position:absolute;inset:-1px;background:linear-gradient(#8caac4,#8caac4) left top/20px 2px no-repeat,linear-gradient(#8caac4,#8caac4) left top/2px 20px no-repeat,linear-gradient(#8caac4,#8caac4) right top/20px 2px no-repeat,linear-gradient(#8caac4,#8caac4) right top/2px 20px no-repeat,linear-gradient(#8caac4,#8caac4) left bottom/20px 2px no-repeat,linear-gradient(#8caac4,#8caac4) left bottom/2px 20px no-repeat,linear-gradient(#8caac4,#8caac4) right bottom/20px 2px no-repeat,linear-gradient(#8caac4,#8caac4) right bottom/2px 20px no-repeat}
.title{height:58px;display:flex;align-items:flex-start;border-bottom:1px solid #31475e}.title h1{font-size:28px;font-weight:600;margin:0}.close{margin-left:auto;color:#a9bcd0;background:transparent;border:0;font-size:30px;width:48px;height:48px;line-height:36px}
.caption{font-size:20px;color:#aab9cc;font-weight:500;margin:22px 0 15px}.temps{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:18px}.block{background:#1b3048;border:1px solid #31475e;position:relative;padding:16px 22px;height:143px}.block .label{font-size:19px;color:#aab9cc}.readout{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.readout b{font-size:50px;font-weight:400;min-width:118px;text-align:center}.readout b.fan{font-size:35px}.step{border:1px solid #415a73;color:#e8f1fb;background:#1d354e;width:58px;height:56px;font-size:30px}.step:active,.option:active,.segment:active{background:#345674}.fanicon{color:#83b6ff;font-size:29px}.statusline{font-size:16px;color:#aab9cc;display:flex;align-items:center;gap:8px}.live{width:7px;height:7px;border-radius:50%;background:#83b6ff}
.modes{display:flex;gap:12px}.option{height:58px;min-width:170px;flex:1;border:1px solid #405870;background:#1b3048;color:#dce8f5;font-size:20px}.option.active,.segment.active{background:#29425e;color:#c7e0ff;border-color:#83b6ff;box-shadow:inset 0 -3px #83b6ff}.option .sub{font-size:16px;color:#a7bad0;margin-left:10px}.sectionline{display:flex;align-items:center;justify-content:space-between}.sectionline .caption{margin-top:22px}.explain{font-size:16px;color:#99adc3}.seats{display:grid;grid-template-columns:1.22fr 1fr;gap:18px}.seat{background:#1b3048;border:1px solid #31475e;padding:16px 20px 18px;min-width:0;height:181px}.seat-head{display:flex;justify-content:space-between;align-items:center}.seat-head strong{font-size:21px}.seat-head span{color:#bcd8f7;font-size:18px}.hint{color:#9eafc3;font-size:16px;margin:8px 0 12px}.segments{display:flex;gap:6px}.segment{min-width:0;flex:1;height:54px;color:#ccd9e9;background:#20384f;border:1px solid #425a72;font-size:18px}.segments .symbol{font-size:14px;color:#a9bcd0}.secondary{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:#9aadc3;font-size:16px}.secondary button{border:1px solid #415a73;background:#1b3048;color:#c6d7e9;height:44px;padding:0 18px;font-size:17px}
.dock{position:absolute;bottom:0;left:0;width:1920px;height:96px;background:#0c1929;border-top:1px solid #31475e;display:flex;align-items:center;padding:0 32px;gap:20px}.nav{display:flex;align-items:center;gap:20px;color:#dce7f4;font-size:27px;width:365px}.nav span{width:48px;text-align:center}.nav .home{color:#f3c77d}.sep{height:34px;width:1px;background:#3b5065}.climate-dock{height:68px;display:flex;align-items:center;gap:7px;background:#1b3048;border:1px solid #405a75;padding:0 10px}.dc{min-width:48px;height:56px;border:0;background:transparent;color:#b7c7d9;font-size:18px}.dc.on{color:#a7d0ff}.temp{font-size:29px;min-width:80px}.fan-btn{font-size:20px;min-width:68px}.power{font-size:29px;color:#f3c77d}.music{display:flex;align-items:center;gap:26px;font-size:25px;color:#e8f0fa}.art{width:56px;height:56px;background:#50627a;display:grid;place-items:center}.song{font-size:17px;line-height:1.4;width:135px}.song small{color:#a6b6c8}.lyrics{font-size:21px;color:#b1c0d2;flex:1;text-align:center}.vehicle{font-size:24px}
@keyframes edgePulse{0%,100%{opacity:.58;transform:scaleY(.84)}50%{opacity:1;transform:scaleY(1)}}
.music-tool{position:relative;flex:1;min-width:0;height:68px;display:flex;align-items:center;gap:18px;padding:0 16px;background:#152a41;border:1px solid #405a75;overflow:hidden}.music-progress{position:absolute;left:0;top:0;bottom:0;width:42%;background:linear-gradient(90deg,#83b6ff14,#83b6ff34);border-right:1px solid #f5cf8680}.music-progress:before{content:"";position:absolute;right:0;top:0;bottom:0;width:130px;background:linear-gradient(270deg,#f5cf864d,#83b6ff26 44%,#83b6ff00);transform-origin:right center;animation:spreadLeft 2.1s ease-in-out infinite}.music-progress:after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,#83b6ff00,#9ad0ff 18%,#f5cf86 50%,#9ad0ff 82%,#83b6ff00);box-shadow:0 0 9px #f5cf8666;animation:edgePulse 1.8s ease-in-out infinite}.music-tool-content{position:relative;display:flex;flex:1;min-width:0;align-items:center;gap:18px}
@keyframes spreadLeft{0%,100%{transform:scaleX(.48);opacity:.55}50%{transform:scaleX(1);opacity:1}}
.icon{display:inline-block;width:28px;height:28px;vertical-align:middle;color:currentColor;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.icon.car{width:52px;height:32px;stroke-width:3}.option,.dc{display:inline-flex;align-items:center;justify-content:center;gap:8px}.option .sub{margin-left:0}.seat-head strong{display:flex;align-items:center;gap:10px}.seat-head .icon{color:#a7cfff;width:27px;height:27px}.dc.power .icon{width:30px;height:30px}.fanicon{display:flex;align-items:center}.fanicon .icon{width:30px;height:30px}.segments .segment{white-space:nowrap}
.segments{margin-top:32px}.seat-group{position:relative;display:flex;align-items:center;flex:1;min-width:0;gap:4px;padding:3px 5px;border:1px solid #48637a}.seat-group.vent{background:#173b52;border-color:#3b7185}.seat-group.heat{background:#43333a;border-color:#755454}.seat-group .group-icon{position:absolute;left:50%;top:-16px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;padding:0 5px;background:#1b3048;pointer-events:none}.seat-group.vent .group-icon{color:#8fd5ec}.seat-group.heat .group-icon{color:#f3b091}.seat-group .icon{width:28px;height:28px}.seat-group .segment{height:48px;border:1px solid transparent;background:transparent}.seat-group.vent .segment{color:#c5e8f2}.seat-group.heat .segment{color:#f3d4c5}.seat-group.vent .segment.active{background:#275e76;border-color:#87cce4;box-shadow:inset 0 -3px #87cce4}.seat-group.heat .segment.active{background:#754d46;border-color:#edb092;box-shadow:inset 0 -3px #edb092}.segment.off{flex:none;width:62px;height:56px}.seat-state.vent{color:#9ed8ee}.seat-state.heat{color:#f2bca2}
.icon.car{stroke-width:2.2}.seat{height:181px}.segments{margin-top:24px;align-items:center}.seat-group{flex-direction:row;align-items:center;gap:6px;padding:0;border:0}.seat-group.vent,.seat-group.heat{background:transparent;border:0}.seat-group .group-caption{display:flex;align-items:center;justify-content:center;width:32px;flex:none}.seat-group.vent .group-caption{color:#9ed8ee}.seat-group.heat .group-caption{color:#f2bca2}.seat-group .icon{width:28px;height:28px}.seat-group .group-levels{display:flex;gap:6px;flex:1;min-width:0}.seat-group .segment{height:54px}.seat-group.vent .segment{background:#173b52;border:1px solid #3b7185}.seat-group.heat .segment{background:#43333a;border:1px solid #755454}.seat-group.vent .segment.active{background:#275e76;border-color:#87cce4}.seat-group.heat .segment.active{background:#754d46;border-color:#edb092}.seat-icon-header .seat-group,.seat-icon-header .group-levels{display:contents}.segment.off{flex:1 1 0;width:auto;height:54px;margin-bottom:0}
.seat-head .title-icons{display:flex;align-items:center;gap:14px;margin-left:auto;margin-right:0}.seat-head .seat-mode{display:flex;align-items:center;gap:4px;font-size:15px;opacity:.65}.seat-head .seat-mode.vent{color:#9ed8ee}.seat-head .seat-mode.heat{color:#f2bca2}.seat-head .seat-mode.active{opacity:1}.seat-head .title-icons .icon,.seat-head strong .seat-mode .icon{width:25px;height:25px;color:inherit}.seat-icon-header .group-caption{display:none}.seat-icon-side .title-icons,.seat-icon-side .seat-head strong .seat-mode{display:none}
.readout{height:60px}.title-icons .seat-mode{gap:0}
.block,.seat,.climate-dock{position:relative}.block:after,.seat:after,.climate-dock:after{content:"";pointer-events:none;position:absolute;inset:-1px;background:linear-gradient(#8caac4,#8caac4) left top/14px 1px no-repeat,linear-gradient(#8caac4,#8caac4) left top/1px 14px no-repeat,linear-gradient(#8caac4,#8caac4) right top/14px 1px no-repeat,linear-gradient(#8caac4,#8caac4) right top/1px 14px no-repeat,linear-gradient(#8caac4,#8caac4) left bottom/14px 1px no-repeat,linear-gradient(#8caac4,#8caac4) left bottom/1px 14px no-repeat,linear-gradient(#8caac4,#8caac4) right bottom/14px 1px no-repeat,linear-gradient(#8caac4,#8caac4) right bottom/1px 14px no-repeat}
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <symbol id="car-05-profile" viewBox="0 0 100 50"><path d="M8 33 L8 26 Q9 22 16 21 L27 19 L39 11 Q43 8 49 8 L64 8 Q69 8 74 12 L82 19 L91 22 Q96 24 96 28 L96 33 Q95 36 91 36 L82 36 M72 36 L33 36 M23 36 L11 36 Q8 36 8 33"/><circle cx="28" cy="36" r="5"/><circle cx="77" cy="36" r="5"/></symbol>
  <symbol id="air-inner" viewBox="0 0 100 50"><use href="#car-05-profile"/><path d="M37 25 C40 20 52 19 61 23 C68 26 65 31 57 31 L47 31 M50 27 L46 31 L50 35"/></symbol>
  <symbol id="air-outer" viewBox="0 0 100 50"><use href="#car-05-profile"/><path d="M30 2 L49 23 M42 22 L49 23 L48 16"/></symbol>
  <symbol id="fan-outline" viewBox="0 0 32 32"><path d="M16 14C4 16 5 4 12 5c5 0 7 4 4 9Zm2 2c-2-12 10-11 9-4 0 5-4 7-9 4Zm-2 2c12-2 11 10 4 9-5 0-7-4-4-9Zm-2-2C16 28 4 27 5 20c0-5 4-7 9-4Z"/><circle cx="16" cy="16" r="2"/></symbol>
  <symbol id="power-outline" viewBox="0 0 32 32"><path d="M16 3v12M9 7a12 12 0 1 0 14 0"/></symbol>
  <symbol id="heat-outline" viewBox="0 0 32 32"><path d="M7 5v13a5 5 0 0 0 5 5h15v5H12a10 10 0 0 1-10-10V5ZM14 17c-4-4 4-5 0-10m6 10c-4-4 4-5 0-10m6 10c-4-4 4-5 0-10"/></symbol>
  <symbol id="vent-outline" viewBox="0 0 32 32"><path d="M7 5v13a5 5 0 0 0 5 5h15v5H12a10 10 0 0 1-10-10V5Z"/><use href="#fan-outline" x="11" y="4" width="18" height="18"/></symbol>
 </defs>
</svg>
<main class="screen">
<div class="status"><strong>09:01</strong><span>UNI 的 LYNK &amp; CO 05</span><span class="dots"><i></i><i></i><i></i></span><span style="margin-left:auto">☁ &nbsp;19° 多云　 ▥ 4G　 ᛒ</span></div>
<div class="desktop"><div class="panel-placeholder"></div><div class="right"><div class="panel-placeholder"></div><div class="panel-placeholder"></div></div></div><div class="scrim"></div>
<section class="sheet" aria-label="空调与座椅预览">
 <div class="title"><h1>空调与座椅</h1><button class="close" aria-label="关闭">×</button></div>
 <div class="caption">温度与风量</div>
 <div class="temps">
  <div class="block"><div class="label">主驾温度</div><div class="readout"><button class="step" data-step="left:-0.5" aria-label="降低主驾温度">−</button><b id="left">21.0°</b><button class="step" data-step="left:0.5" aria-label="提高主驾温度">＋</button></div></div>
  <div class="block"><div class="label">风量</div><div class="readout"><button class="step" data-step="fan:-1" aria-label="降低风量">−</button><span class="fanicon"><svg class="icon" aria-hidden="true"><use href="#fan-outline"/></svg></span><b id="fan" class="fan">AUTO</b><button class="step" data-step="fan:1" aria-label="提高风量">＋</button></div></div>
  <div class="block"><div class="label">副驾温度</div><div class="readout"><button class="step" data-step="right:-0.5" aria-label="降低副驾温度">−</button><b id="right">21.0°</b><button class="step" data-step="right:0.5" aria-label="提高副驾温度">＋</button></div></div>
 </div>
 <div class="caption">空调模式</div><div class="modes">
  <button class="option active" data-mode="ac">A/C <span class="sub">制冷</span></button><button class="option active" data-mode="auto">AUTO</button><button class="option active" data-mode="recirc"><svg class="icon car" aria-hidden="true"><use data-circulation href="#air-inner"/></svg><span id="recirc-label">内循环</span></button><button class="option" data-mode="sync">SYNC <span class="sub">双区同步</span></button><button class="option active" data-mode="power"><svg class="icon" aria-hidden="true"><use href="#power-outline"/></svg><span class="sub">电源</span></button>
 </div>
 <div class="sectionline"><div class="caption">座椅舒适</div></div>
 <div class="seats">
  <div class="seat"><div class="seat-head"><strong>主驾<span class="seat-mode vent" data-seat-mode="driver:vent" role="img" aria-label="主驾座椅通风"><svg class="icon" aria-hidden="true"><use href="#vent-outline"/></svg></span></strong><span class="title-icons"><span class="seat-mode heat" data-seat-mode="driver:heat" role="img" aria-label="主驾座椅加热"><svg class="icon" aria-hidden="true"><use href="#heat-outline"/></svg></span></span></div><div class="segments" id="driver"></div></div>
  <div class="seat"><div class="seat-head"><strong>副驾</strong><span class="title-icons"><span class="seat-mode heat" data-seat-mode="passenger:heat" role="img" aria-label="副驾座椅加热"><svg class="icon" aria-hidden="true"><use href="#heat-outline"/></svg></span></span><span id="passenger-state" class="seat-state"></span></div><div class="segments" id="passenger"></div></div>
 </div>
 <div class="secondary"><span class="statusline"><i class="live"></i>示意数据 · 页面仅用于设计预览</span><button>打开原车空调</button></div>
</section>
<footer class="dock"><div class="nav"><span>‹</span><span class="home">⌂</span><span>▦</span><span>▢</span><span>⟳<small style="font-size:11px">360</small></span></div><div class="sep"></div>
 <div class="climate-dock"><button class="dc on" data-dock="ac">A/C</button><button class="dc temp" id="dock-left">21.0°</button><button class="dc fan-btn" id="dock-fan"><svg class="icon" aria-hidden="true"><use href="#fan-outline"/></svg><span id="dock-fan-value">AUTO</span></button><button class="dc on" data-dock="recirc"><svg class="icon car" aria-hidden="true"><use data-circulation href="#air-inner"/></svg></button><button class="dc temp" id="dock-right">21.0°</button><button class="dc power" data-dock="power" aria-label="空调电源"><svg class="icon" aria-hidden="true"><use href="#power-outline"/></svg></button></div><div class="sep"></div>
 <div class="music-tool"><div class="music-progress" aria-hidden="true"></div><div class="music-tool-content"><div class="music"><span>◀</span><span>Ⅱ</span><span>▶</span><div class="art">♫</div><div class="song">向海而行<br><small>Coastline</small></div></div><div class="lyrics">音乐与歌词</div></div></div><div class="sep"></div><span class="vehicle">▱</span>
</footer>
</main>
<script>
const state={left:21,right:21,fan:3,auto:true,ac:true,sync:false,recirc:true,power:true,driver:{mode:'heat',level:2},passenger:{mode:'off',level:0}};
const previewOptions=new URLSearchParams(location.search);
document.body.classList.add(previewOptions.get('seatIcons')==='side'?'seat-icon-side':'seat-icon-header');
if(previewOptions.get('seatIcons')==='right')document.body.classList.add('seat-icon-right');
if(previewOptions.get('recirc')==='outside')state.recirc=false;
const defs={driver:[{mode:'vent',levels:[3,2,1]},{mode:'off',levels:[0]},{mode:'heat',levels:[1,2,3]}],passenger:[{mode:'off',levels:[0]},{mode:'heat',levels:[1,2,3]}]};
function draw(){
 for(const zone of ['left','right']){document.getElementById(zone).textContent=state[zone].toFixed(1)+'°';document.getElementById('dock-'+zone).textContent=state[zone].toFixed(1)+'°'}
 document.getElementById('fan').textContent=state.auto?'AUTO':state.fan+' 档';document.getElementById('dock-fan-value').textContent=state.auto?'AUTO':state.fan;
 document.getElementById('recirc-label').textContent=state.recirc?'内循环':'外循环';
 document.querySelectorAll('[data-circulation]').forEach(u=>u.setAttribute('href',state.recirc?'#air-inner':'#air-outer'));
 document.querySelector('[data-dock="recirc"]').setAttribute('aria-label',state.recirc?'内循环，点击切换外循环':'外循环，点击切换内循环');
 document.querySelector('[data-mode="recirc"]').setAttribute('aria-label',state.recirc?'内循环，点击切换外循环':'外循环，点击切换内循环');
 document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode==='recirc'||state[b.dataset.mode]);b.setAttribute('aria-pressed',state[b.dataset.mode])});
 document.querySelectorAll('[data-dock]').forEach(b=>b.classList.toggle('on',b.dataset.dock==='recirc'||state[b.dataset.dock]));
 for(const zone of ['driver','passenger']){
  const current=state[zone],holder=document.getElementById(zone);holder.replaceChildren();
  const status=document.getElementById(zone+'-state');if(status){status.textContent=current.mode==='off'?'':(current.mode==='vent'?'通风 ':'加热 ')+current.level+' 档';status.className='seat-state '+current.mode}
  document.querySelectorAll('[data-seat-mode^="'+zone+':"]').forEach(el=>el.classList.toggle('active',el.dataset.seatMode===zone+':'+current.mode));
  for(const {mode,levels} of defs[zone]){
   const group=mode==='off'?holder:document.createElement('div');
   let levelHolder=group;
   if(mode!=='off'){group.className='seat-group '+mode;group.setAttribute('role','group');group.setAttribute('aria-label',(zone==='driver'?'主驾':'副驾')+(mode==='vent'?'座椅通风':'座椅加热'));const icon=document.createElement('div');icon.className='group-caption';icon.innerHTML='<svg class="icon" aria-hidden="true"><use href="#'+(mode==='vent'?'vent-outline':'heat-outline')+'"/></svg>';levelHolder=document.createElement('div');levelHolder.className='group-levels';if(mode==='vent')group.append(icon);group.append(levelHolder);if(mode==='heat')group.append(icon)}
   for(const level of levels){const b=document.createElement('button');b.className='segment'+(mode==='off'?' off':'');b.textContent=mode==='off'?'关':level;b.classList.toggle('active',current.mode===mode&&current.level===level);b.setAttribute('aria-label',(zone==='driver'?'主驾':'副驾')+(mode==='off'?'关闭':(mode==='vent'?'通风':'加热')+level+'档'));b.setAttribute('aria-pressed',current.mode===mode&&current.level===level);b.onclick=()=>{state[zone]={mode,level};draw()};levelHolder.append(b)}
   if(mode!=='off')holder.append(group);
  }
 }
}
document.querySelectorAll('[data-mode],[data-dock]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.mode||b.dataset.dock;state[key]=!state[key];draw()}));
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const [key,change]=b.dataset.step.split(':');state[key]=Math.max(key==='fan'?0:16,Math.min(key==='fan'?7:31,state[key]+Number(change)));if(key==='fan')state.auto=false;draw()}));
draw();
</script></body></html>
