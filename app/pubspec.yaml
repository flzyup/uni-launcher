name: uni_launcher
description: Flutter launcher for Lynk & Co head units with native Android integrations.
publish_to: none
version: 0.7.2+48
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/art/
    - assets/wallpapers/
